app-id: io.github.surdo64.palpite-milionario
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: palpite-milionario

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11

modules:
  - python3-deps.json

  - name: palpite-milionario
    buildsystem: simple
    build-commands:
      - install -d /app/lib/python3.13/site-packages
      - cp -r src/palpiteiro /app/lib/python3.13/site-packages/
      - install -Dm755 flatpak/palpite-milionario-source-wrapper /app/bin/palpite-milionario
      - install -Dm644 flatpak/io.github.surdo64.palpite-milionario.desktop /app/share/applications/io.github.surdo64.palpite-milionario.desktop
      - install -Dm644 assets/app-icon.png /app/share/icons/hicolor/256x256/apps/io.github.surdo64.palpite-milionario.png
      - install -Dm644 flatpak/io.github.surdo64.palpite-milionario.metainfo.xml /app/share/metainfo/io.github.surdo64.palpite-milionario.metainfo.xml
    sources:
      - type: git
        url: https://github.com/surdo64/palpite-milionario.git
        commit: 444af04c908a05c0e43ec86e3cd9f80039ef1ece
